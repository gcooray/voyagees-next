<svg viewBox="0 0 380 92" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Icon: circular badge echoing the numbered circles used across
       the site (value-icon, market-step-number) — a small looping
       route/pin mark instead of a literal letter -->
  <circle cx="40" cy="46" r="30" fill="none" stroke="#e2a63b" stroke-width="1.6"/>
  <path d="M26 54 C26 38, 54 38, 54 54 C54 62, 44 62, 42 54 C40 46, 48 44, 50 50"
        fill="none" stroke="#e2a63b" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="2.6" fill="#e2a63b"/>

  <!-- Wordmark -->
  <text x="86" y="52"
        font-family="Georgia, 'Times New Roman', serif"
        font-style="italic"
        font-size="34"
        letter-spacing="0.5"
        fill="#fbf7ef">Voya<tspan fill="#e2a63b">g</tspan>ees</text>

  <!-- Tagline -->
  <text x="87" y="72"
        font-family="Georgia, 'Times New Roman', serif"
        font-style="italic"
        font-size="12.5"
        letter-spacing="1.5"
        fill="#2b6e71">your tour, your way</text>
</svg>
